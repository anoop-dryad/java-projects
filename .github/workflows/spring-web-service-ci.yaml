name: spring-web-service-ci 🚀
on:
  push:
    branches: [main]
    paths: ["spring-web-service/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "26"
          cache: "maven"
      - name: Build with Maven
        run: mvn -B package --file spring-web-service/pom.xml
      - name: Setup docker image
      - name: Login to Docker Private repository
      - name: Build and Push to repository
